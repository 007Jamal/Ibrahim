name: Fix final site URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-final-url.yml'

permissions:
  contents: write

jobs:
  update-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update canonical, OG and JSON-LD URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://ibrahim.vercel.app/'
          new = 'https://ibrahim-ai-evaluation.vercel.app/'
          if old not in s:
              raise SystemExit('Old URL not found in index.html')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit updated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix AI site canonical and metadata URLs'
          git push
